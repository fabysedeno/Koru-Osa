<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Papelería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1E8;
    --surface:#FFFFFF;
    --surface-2:#EDEDE3;
    --primary:#4F5609;
    --primary-light:#7C8340;
    --secondary:#BCBFA6;
    --accent:#C08A28;
    --accent-light:#E9CE93;
    --danger:#A6432F;
    --danger-light:#F0DAD3;
    --text:#232620;
    --text-muted:#6B6F63;
    --border:#DAD5C4;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  .app{max-width:900px;margin:0 auto;padding:0 16px 60px;}

  header.top{padding:28px 16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  header.top .title-wrap{min-width:0;flex:1;}
  header.top .leaf{height:48px;width:auto;flex-shrink:0;object-fit:contain;}
  header.top h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;color:var(--primary);letter-spacing:-0.01em;}
  header.top p{margin:2px 0 0;font-size:13px;color:var(--text-muted);}
  header.top .conn{margin-left:auto;font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  header.top .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary);}
  header.top .dot.off{background:var(--danger);}

  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;}
  nav.tabs button{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .15s ease;}
  nav.tabs button:hover{border-color:var(--primary-light);color:var(--primary);}
  nav.tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .view{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-sizing:border-box;overflow-x:auto;}
  .card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 4px;color:var(--primary);}
  .card .sub{font-size:13px;color:var(--text-muted);margin:0 0 16px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

  .stock-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .stock-ok{background:#EAEBE3;color:var(--primary);}
  .stock-low{background:var(--danger-light);color:var(--danger);}

  select,input[type=number],input[type=text],input[type=password],input[type=date]{font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%;box-sizing:border-box;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  select:focus,input:focus{outline:2px solid var(--secondary);outline-offset:1px;}
  label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;}

  button.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:12px 18px;min-height:44px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;transition:transform .1s ease, background .15s ease;}
  button.btn:hover{background:var(--primary-light);}
  button.btn:active{transform:scale(.98);}
  button.btn.ghost{background:transparent;color:var(--primary);}
  button.btn.ghost:hover{background:var(--surface-2);}
  button.btn.danger{background:var(--danger);border-color:var(--danger);}
  button.btn.small{padding:6px 12px;font-size:12.5px;border-radius:6px;min-height:0;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  .item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .item-row .name{font-weight:600;font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere;}
  .item-row .stock{font-size:12px;color:var(--text-muted);}
  input.qty-input[type=number]{width:76px !important;text-align:right;flex-shrink:0;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);font-weight:700;cursor:pointer;font-size:15px;color:var(--primary);}
  .stepper span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}

  .cart{background:var(--surface-2);border-radius:10px;padding:14px 16px;margin:16px 0;}
  .cart h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .cart-item{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:4px 0;}

  .ficha{border:1px dashed var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;position:relative;background:var(--surface);}
  .ficha .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ficha .area{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--primary);}
  .ficha .fecha{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .ficha ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;}
  .ficha li{margin-bottom:2px;}
  .stamp{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;transform:rotate(-4deg);white-space:nowrap;}
  .stamp.pendiente{border:2px solid var(--accent);color:var(--accent);}
  .stamp.entregado{border:2px solid var(--primary);color:var(--primary);}
  .stamp.cancelado,.stamp.anulado{border:2px solid var(--text-muted);color:var(--text-muted);}
  .stamp.devuelto{border:2px solid var(--danger);color:var(--danger);}
  .factura.anulada{opacity:.55;}
  .factura.anulada ul{text-decoration:line-through;}

  .empty{text-align:center;padding:36px 16px;color:var(--text-muted);font-size:14px;}
  .empty .big{font-family:'Fraunces',serif;font-size:17px;color:var(--primary);margin-bottom:4px;}

  .lock-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 20px;text-align:center;}
  .lock-box input{max-width:180px;text-align:center;letter-spacing:.3em;font-size:20px;}
  .error-msg{color:var(--danger);font-size:12.5px;margin-top:6px;}

  .subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{font-size:13px;font-weight:600;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;}
  .subtabs button.active{background:var(--surface-2);color:var(--primary);border-color:var(--primary-light);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .badge-count{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;margin-left:5px;font-weight:700;}

  .stats-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .stat-box{background:var(--surface-2);border-radius:12px;padding:16px 20px;min-width:150px;flex:1;}
  .stat-box-total{background:var(--primary);}
  .stat-box-total .stat-num,.stat-box-total .stat-label,.stat-box-total .stat-money{color:#fff;}
  .stat-num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--primary);line-height:1;}
  .stat-label{font-size:12.5px;color:var(--text-muted);margin:4px 0 8px;font-weight:600;}
  .stat-money{font-size:19px;font-weight:700;color:var(--accent);}

  .section-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--primary);margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--secondary);}
  .factura{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .factura .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .factura .proveedor{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--primary);}
  .factura .fecha{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .factura .costo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .factura ul{margin:12px 0 0;padding-left:18px;font-size:13.5px;}
  .factura li{margin-bottom:3px;overflow-wrap:anywhere;}

  .setup-banner{background:var(--danger-light);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:14px 16px;font-size:13.5px;margin-bottom:16px;line-height:1.5;}
  .setup-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;}
</style>
</head>

    <div class="title-wrap">
      <h1>Inventario de papelería</h1>
      <p>Pedidos, entregas y existencias, sincronizado con Google Sheets</p>
    </div>
    <div class="conn" id="connStatus"><span class="dot"></span>Conectando…</div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="viewRoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =======================================================================
   CONFIGURACIÓN: pega aquí la URL de tu Apps Script (termina en /exec)
   ======================================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRha0-sfthPTWL6MROTDMBLsrHIs7N6AnGEbn34ssWtcdMwuhXO2GXj5nraa6ywpPojA/exec";
/* ======================================================================= */

let AREAS = ["Esporas","Koru","Lecto","Helechos 1","Helechos 2","Oficina","General","Talleristas"];
const LOW_STOCK_THRESHOLD = 5;
const POLL_MS = 45000;

let inventario = {};
let pedidos = [];
let entradas = [];
let auditoria = [];
let salonesDetalle = [];
let carritoCompra = {};
let carritoEntregaDirecta = {};
let compraProveedor = 'La Estrella Mayorista en Papelería';
let compraFecha = '';
let compraCostoTotal = '';
let compraEditandoId = null;
let conectado = false;
let currentTab = "inventario";
let opsUnlocked = false;
let opsPin = null;
let opsOperador = '';
let opsSubtab = "pendientes";
let pedidoArea = AREAS[0];
let entregaDirectaArea = AREAS[0];
let historialArea = AREAS[0];
let carrito = {};
let pendientesConocidos = new Set();

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function generarId(prefijo){
  return prefijo + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function setConn(ok){
  conectado = ok;
  const el = document.getElementById('connStatus');
  el.innerHTML = ok
    ? '<span class="dot"></span>Sincronizado'
    : '<span class="dot off"></span>Sin conexión con la hoja';
}

async function apiGet(){
  if(APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0) throw new Error('Esta app aún no está conectada a tu Google Sheet. Busca APPS_SCRIPT_URL casi al inicio del código y pega ahí tu URL.');
  const res = await fetch(APPS_SCRIPT_URL, { method:'GET' });
  if(!res.ok) throw new Error('GET falló');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function apiPost(payload){
  if(APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0) throw new Error('Esta app aún no está conectada a tu Google Sheet. Busca APPS_SCRIPT_URL casi al inicio del código y pega ahí tu URL.');
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('POST falló');
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

function usuarioEstaOcupado(){
  const el = document.activeElement;
  const enCampo = el && ['INPUT','SELECT','TEXTAREA'].includes(el.tagName);
  const conCarritoPendiente =
    Object.values(carrito).some(q=>q>0) ||
    Object.values(carritoCompra).some(q=>q>0) ||
    Object.values(carritoEntregaDirecta).some(q=>q>0);
  return enCampo || conCarritoPendiente;
}

async function refrescar(silencioso){
  if(APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){ setConn(false); return; }
  try{
    const data = await apiGet();
    inventario = data.inventario || {};
    entradas = data.entradas || [];
    auditoria = data.auditoria || [];
    salonesDetalle = data.salonesDetalle || [];
    if(data.salones && data.salones.length) AREAS = data.salones;
    if(!AREAS.includes(pedidoArea)) pedidoArea = AREAS[0];
    if(!AREAS.includes(historialArea)) historialArea = AREAS[0];
    const nuevos = (data.pedidos || []);
    detectarNuevosPendientes(nuevos);
    pedidos = nuevos;
    setConn(true);
    renderAll();
  }catch(e){
    setConn(false);
    if(!silencioso) showToast('No se pudo conectar con la hoja. Revisa tu internet.');
  }
}

function detectarNuevosPendientes(nuevaLista){
  const idsPendientesNuevos = nuevaLista.filter(p=>p.estado==='pendiente').map(p=>p.id);
  if(pendientesConocidos.size > 0){
    idsPendientesNuevos.forEach(id=>{
      if(!pendientesConocidos.has(id)){
        const p = nuevaLista.find(x=>x.id===id);
        showToast(`Nuevo pedido de ${p.area}`);
        if('Notification' in window && Notification.permission === 'granted'){
          new Notification('Nuevo pedido de material', { body: `${p.area} acaba de pedir ${p.items.length} artículo(s).` });
        }
      }
    });
  }
  pendientesConocidos = new Set(idsPendientesNuevos);
}

function fmtFecha(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

function renderTabs(){
  const tabs = [
    ['inventario','Inventario general'],
    ['pedir','Hacer un pedido'],
    ['historial','Mi historial'],
    ['operaciones','Operaciones']
  ];
  const pendCount = pedidos.filter(p=>p.estado==='pendiente').length;
  const nav = document.getElementById('tabs');
  nav.innerHTML = tabs.map(([key,label])=>{
    let extra = '';
    if(key==='operaciones' && pendCount>0) extra = `<span class="badge-count">${pendCount}</span>`;
    return `<button data-tab="${key}" class="${currentTab===key?'active':''}">${label}${extra}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; renderAll(); };
  });
}

function renderSetupBanner(){
  if(APPS_SCRIPT_URL.indexOf('PEGA_AQUI') !== 0) return '';
  return `<div class="setup-banner">
    Esta app aún no está conectada a tu hoja de Google. Abre el archivo HTML, busca la línea
    <code>APPS_SCRIPT_URL</code> cerca del inicio del &lt;script&gt; y pega ahí la URL que te da
    Apps Script al publicar (termina en <code>/exec</code>).
  </div>`;
}

function renderInventarioView(){
  const items = Object.keys(inventario).sort();
  const rows = items.map(name=>{
    const qty = inventario[name];
    const low = qty <= LOW_STOCK_THRESHOLD;
    return `<tr>
      <td>${escapeHtml(name)}</td>
      <td class="num">${qty}</td>
      <td class="num"><span class="stock-pill ${low?'stock-low':'stock-ok'}">${low?'Stock bajo':'Suficiente'}</span></td>
    </tr>`;
  }).join('');
  return `
  <div class="view">
    ${renderSetupBanner()}
    <div class="card">
      <h2>Existencias actuales</h2>
      <p class="sub">Visible para todos. Solo Operaciones puede modificar cantidades. Se actualiza cada ${POLL_MS/1000}s.</p>
      <table>
        <tr><th>Material</th><th style="text-align:right">Cantidad</th><th style="text-align:right">Estado</th></tr>
        ${rows || '<tr><td colspan=3 class="empty">Aún no hay materiales cargados.</td></tr>'}
      </table>
    </div>
  </div>`;
}

function renderPedirView(){
  const items = Object.keys(inventario).sort();
  const cartEntries = Object.entries(carrito).filter(([,q])=>q>0);
  const itemRows = items.map(name=>{
    const c = carrito[name] || 0;
    return `<div class="item-row">
      <div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="stock">Disponible: ${inventario[name]}</div>
      </div>
      <input type="number" min="0" class="qty-input" data-pedido-qty="${escapeHtml(name)}" value="${c||''}" placeholder="0">
    </div>`;
  }).join('');

  const cartHtml = cartEntries.length ? `
    <div class="cart">
      <h3>Tu pedido</h3>
      ${cartEntries.map(([n,q])=>`<div class="cart-item"><span>${escapeHtml(n)}</span><strong>${q}</strong></div>`).join('')}
    </div>` : '';

  return `
  <div class="view">
    <div class="card">
      <h2>Pedir material</h2>
      <p class="sub">Elige tu salón o área y agrega lo que necesitas. Operaciones recibe un correo al instante.</p>
      <div class="field">
        <label>Salón / área</label>
        <select id="pedidoAreaSel">
          ${AREAS.map(a=>`<option value="${escapeHtml(a)}" ${a===pedidoArea?'selected':''}>${escapeHtml(a)}</option>`).join('')}
        </select>
      </div>
      ${itemRows}
      ${cartHtml}
      <div style="margin-top:16px;display:flex;justify-content:flex-end;">
        <button class="btn" id="enviarPedidoBtn" ${cartEntries.length?'':'disabled'}>Enviar pedido</button>
      </div>
      <div class="error-msg" id="pedidoError" style="display:none;"></div>
    </div>
  </div>`;
}

function renderHistorialView(){
  const propios = pedidos.filter(p=>p.area===historialArea).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const fichas = propios.map(p=>`
    <div class="ficha">
      <div class="top-row">
        <div>
          <div class="area">${escapeHtml(p.area)}</div>
          <div class="fecha">Pedido: ${fmtFecha(p.fecha)}${p.fechaEntrega?`<br>Entregado: ${fmtFecha(p.fechaEntrega)}`:''}</div>
        </div>
        <span class="stamp ${p.estado}">${p.estado}</span>
      </div>
      <ul>${p.items.map(i=>`<li>${escapeHtml(i.nombre)} — ${i.cantidad}</li>`).join('')}</ul>
    </div>`).join('');

  return `
  <div class="view">
    <div class="card">
      <h2>Mi historial de pedidos</h2>
      <p class="sub">Todo lo que tu área ha solicitado en el ciclo.</p>
      <div class="field">
        <label>Salón / área</label>
        <select id="historialAreaSel">

function renderAll(){
  renderTabs();
  const root = document.getElementById('viewRoot');
  if(currentTab==='inventario') root.innerHTML = renderInventarioView();
  else if(currentTab==='pedir') root.innerHTML = renderPedirView();
  else if(currentTab==='historial') root.innerHTML = renderHistorialView();
  else root.innerHTML = renderOperacionesView();
  attachHandlers();
}

function sincronizarCamposCompra(){
  const p = document.getElementById('compraProveedor');
  const f = document.getElementById('compraFecha');
  const c = document.getElementById('compraCosto');
  if(p) compraProveedor = p.value;
  if(f) compraFecha = f.value;
  if(c) compraCostoTotal = c.value;
}

function attachHandlers(){
  if(currentTab==='pedir'){
    const sel = document.getElementById('pedidoAreaSel');
    if(sel) sel.onchange = ()=>{ pedidoArea = sel.value; renderAll(); };
    document.querySelectorAll('[data-pedido-qty]').forEach(inp=>{
      inp.onchange = ()=>{
        const n = inp.dataset.pedidoQty;
        const v = Math.max(0, parseInt(inp.value,10) || 0);
        carrito[n] = v;
        renderAll();
      };
    });
    const sendBtn = document.getElementById('enviarPedidoBtn');
    if(sendBtn) sendBtn.onclick = async ()=>{

    if(entregaDirectaAreaSel) entregaDirectaAreaSel.onchange = ()=>{ entregaDirectaArea = entregaDirectaAreaSel.value; renderAll(); };

function agruparCompras(lista){
  const grupos = {};
  const orden = [];
  lista.forEach((en,i)=>{
    const key = en.idCompra || ('legacy_'+i);
    if(!grupos[key]){
      grupos[key] = { idCompra: key, fecha: en.fecha, proveedor: en.proveedor||'', costoTotal: 0, items: [], estado: en.estado||'activo' };
      orden.push(key);
    }
    grupos[key].items.push({ nombre: en.material, cantidad: en.cantidad });
    if(en.estado==='anulado') grupos[key].estado = 'anulado';
    if(en.costoTotal!==null && en.costoTotal!==undefined && en.costoTotal!==''){
      grupos[key].costoTotal = Number(en.costoTotal)||0;
    }
  });
  return orden.map(k=>grupos[k]);
}

function estadisticasPorAnio(grupos){
  const stats = {};
  grupos.forEach(g=>{
    const anio = new Date(g.fecha).getFullYear();
    if(!stats[anio]) stats[anio] = { count:0, total:0 };
    stats[anio].count++;
    stats[anio].total += g.costoTotal||0;
  });
  return stats;
}

function construirFilasCompras(grupos){
  const filas = [['Fecha','Proveedor','Costo total','Material','Cantidad']];
  grupos.forEach(g=>{
    g.items.forEach((it,idx)=>{
      filas.push([idx===0?fmtFecha(g.fecha):'', idx===0?g.proveedor:'', idx===0?g.costoTotal.toFixed(2):'', it.nombre, it.cantidad]);
    });
  });
  return filas;
}

function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function filasACsv(filas){
  return filas.map(f=>f.map(csvEscape).join(',')).join('\r\n');
}

function descargarCSV(filas, nombreArchivo){
  const csv = '\ufeff' + filasACsv(filas); // BOM para que Excel muestre acentos bien
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Descarga lista');
}

function construirFilasSalon(area){
  const filas = [['Salón','Fecha del pedido','Estado','Fecha de entrega','Material','Cantidad']];
  pedidos.filter(p=>p.area===area).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(p=>{
    p.items.forEach(i=>{
      filas.push([p.area, fmtFecha(p.fecha), p.estado, p.fechaEntrega?fmtFecha(p.fechaEntrega):'', i.nombre, i.cantidad]);
    });
  });
  return filas;
}

function construirFilasGeneral(){
  const filas = [['Salón','Fecha del pedido','Estado','Fecha de entrega','Material','Cantidad']];
  pedidos.slice().sort((a,b)=>a.area.localeCompare(b.area) || new Date(a.fecha)-new Date(b.fecha)).forEach(p=>{
    p.items.forEach(i=>{
      filas.push([p.area, fmtFecha(p.fecha), p.estado, p.fechaEntrega?fmtFecha(p.fechaEntrega):'', i.nombre, i.cantidad]);
    });
  });
  return filas;
}

function abrirVentanaImpresion(titulo, filasHtml){
  const win = window.open('', '_blank');
  if(!win){ showToast('Tu navegador bloqueó la ventana. Permite pop-ups para este sitio e intenta de nuevo.'); return; }
  win.document.write(`
    <html><head><title>${titulo}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#232620;}
      h1{font-size:18px;margin-bottom:2px;}
      p.meta{color:#666;font-size:12px;margin-top:0;margin-bottom:18px;}
      table{width:100%;border-collapse:collapse;font-size:13px;}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
      th{background:#EDEDE3;}
    </style></head><body>
      <h1>${titulo}</h1>
      <p class="meta">Generado el ${new Date().toLocaleString('es-MX')}</p>
      ${filasHtml}
    </body></html>
  `);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(), 300);
}

function tablaHtmlDeFilas(filas){
  const [encabezado, ...resto] = filas;
  return `<table><tr>${encabezado.map(h=>`<th>${escapeHtml(String(h))}</th>`).join('')}</tr>
    ${resto.map(f=>`<tr>${f.map(c=>`<td>${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${encabezado.length}">Sin registros</td></tr>`}
  </table>`;
}

function imprimirReporteSalon(area){
  const filas = construirFilasSalon(area);
  abrirVentanaImpresion(`Historial de pedidos — ${escapeHtml(area)}`, tablaHtmlDeFilas(filas));
}

function imprimirReporteGeneral(){
  const filas = construirFilasGeneral();
  abrirVentanaImpresion('Reporte general por salones', tablaHtmlDeFilas(filas));
}

})();
